<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导演时间预览</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="extensions_settings"></div>
  <script type="module">
    import { createDirectorConsole } from '/src/ui/director-console.js';
    import { createDirectorState, createGlobalSettings } from '/src/state/default-state.js';

    const root = document.createElement('div');
    document.querySelector('#extensions_settings').append(root);
    const settings = createGlobalSettings();
    const state = createDirectorState('qa-preview', 'qa-character');
    state.status = 'active';
    state.activeEvent = { title: '让 char 策划旅行', premise: '角色主动安排出发与游玩' };
    state.foreshadowing = [{ id: 'f1', title: '未拆封的车票' }];
    state.generation = { phase: 'failed', error: '正文生成失败' };
    state.diagnostics.records = [{
      id: 'qa-failure', trigger: 'manual', status: 'failed', stage: 'reply',
      startedAt: '2026-08-13T10:00:00.000Z', finishedAt: '2026-08-13T10:00:01.245Z', durationMs: 1245,
      message: '正文生成服务暂时不可用，请检查主连接状态。这是一条用于验证窄屏长错误文本自动换行且不会撑开检查窗口的诊断记录。',
    }];
    state.cast = {
      mode: 'multi',
      locked: false,
      leadId: 'a',
      members: [
        { id: 'a', name: '林澈', aliases: ['阿澈'], evidence: ['角色卡：做事周密'] },
        { id: 'b', name: '周遥', aliases: [], evidence: ['世界书：熟悉当地交通'] },
      ],
    };
    const services = {
      saveSettings() {},
      saveState() {},
      notice(message) { document.body.dataset.lastNotice = message; },
      confirm: async () => true,
      listModels: async () => ['director-small', 'director-large'],
      testConnection: async () => true,
      runDiagnostics: async () => ({
        checkedAt: new Date().toISOString(),
        summary: { connectionMode: 'main', installedWorldBooks: 2 },
        checks: [
          { id: 'chat', label: '当前聊天', status: 'pass', message: '已连接当前聊天。' },
          { id: 'connection', label: '连接配置', status: 'pass', message: '将使用 SillyTavern 当前主连接。' },
          { id: 'world-books', label: '世界书', status: 'warning', message: '发现 2 本世界书，请确认需要参考的条目。' },
        ],
      }),
      copyDiagnosticReport: async (snapshot) => { document.body.dataset.copiedRecords = String(snapshot.records.length); },
      worldInfoNames: () => ['城市设定', '全局关系'],
      loadWorldInfoBook: async (name) => ({ name, entries: name === '城市设定'
        ? [{ id: 'shared', name: '街区与交通' }, { id: 'weather', name: '季节气候' }]
        : [{ id: 'shared', name: '人物关系' }, { id: 'rules', name: '共同规则' }] }),
      personalityProfile: () => ({ name: '林澈', lines: ['做事周密，倾向提前规划。', '会主动照顾同伴的节奏。'], sources: ['角色卡', '城市设定'] }),
      onManualEvent() {},
      lockCast() {},
      correctCast() {},
      previewTheme() {},
      saveTheme() {},
      disableTheme() {},
      rollbackTheme() {},
      resetTheme() {},
      exportTheme() {},
      importTheme() {},
      exportSnapshot() {},
      importSnapshot() {},
      undoImport() {},
      stop() {},
      isGroupChat: () => false,
    };
    const consoleInstance = createDirectorConsole({ root, services });
    consoleInstance.mount({ settings, state });
    consoleInstance.open();
  </script>
</body>
</html>
